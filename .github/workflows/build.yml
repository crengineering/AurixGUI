name: Build

on:
  push:
  pull_request:

# Least privilege: this job only reads the checkout and uploads an
# artifact, neither of which needs write access to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtserialport'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Build attitude self-check (SWE1-GUI-001 evidence, headless)
        run: cmake --build build --config Release --target attitude_selfcheck

      - name: Run attitude self-check
        shell: cmd
        run: build\Release\attitude_selfcheck.exe

      - name: Build position self-check (SWE1-GUI-006/-007/-008 evidence, headless)
        run: cmake --build build --config Release --target position_selfcheck

      - name: Run position self-check
        shell: cmd
        run: build\Release\position_selfcheck.exe

      - name: Build diagnostics word-grouping self-check (headless)
        run: cmake --build build --config Release --target diag_selfcheck

      - name: Run diagnostics self-check
        shell: cmd
        run: build\Release\diag_selfcheck.exe

      - name: Deploy Qt DLLs
        run: windeployqt --release build/Release/SerialMonitor.exe

      # Qt is used under LGPL-3.0 and is shipped as unmodified DLLs next to the
      # executable. LGPL-3.0 section 4 requires that a binary distribution carry
      # a prominent notice naming the library, plus copies of the LGPL and the
      # GPL it incorporates. The uploaded artifact is such a distribution once
      # this repository is public, so the paperwork travels with it.
      - name: Bundle license texts with the artifact
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE     build/Release/LICENSE.txt
          cp NOTICE.txt  build/Release/NOTICE.txt
          curl -fsSL --retry 3 https://www.gnu.org/licenses/lgpl-3.0.txt \
               -o build/Release/LICENSE.LGPL-3.0.txt
          curl -fsSL --retry 3 https://www.gnu.org/licenses/gpl-3.0.txt \
               -o build/Release/LICENSE.GPL-3.0.txt
          ls -l build/Release/*.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SerialMonitor-windows
          path: build/Release/
